<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Will you be my Valentine 💖??</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff69b4, #ffc0cb);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
    }

    .card {
      background: white;
      padding: 40px 60px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      color: #ff1493;
      margin-bottom: 30px;
      font-size: 32px;
    }

    button {
      font-size: 18px;
      padding: 12px 30px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .yes {
      background-color: #ff69b4;
      color: white;
    }

    .no {
      background-color: #ddd;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my Valentine? 💘</h1>
    <button class="yes" onclick="yesClicked()">Yes 💖</button>
    <button class="no" onclick="noClicked()">No 😜</button>
  </div>

  <script>
    function noClicked() {
      alert("You don't have this choice 😌");
    }

    function yesClicked() {
      alert("Yayyy! 🎉💖 You're my Valentine!");
    }
  </script>

</body>
</html>
