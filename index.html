<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BB Will you be my Valentine 💖??</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff69b4, #ffc0cb);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", cursive, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px 60px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      z-index: 10;
      width: 360px;
      position: relative;
    }

    .avatar {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      color: #ff1493;
      margin-bottom: 30px;
      font-size: 24px;
    }

    button {
      font-size: 18px;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .yes {
      background-color: #ff69b4;
      color: white;
      margin-right: 20px;
    }

    /* No button runs away */
    .no {
      background-color: #eee;
      color: #555;
      position: fixed;
      top: 55%;
      left: 55%;
      z-index: 20;
    }

    /* Shy text */
    .shy-text {
      margin-top: 25px;
      font-size: 14px;
      color: #888;
      display: none;
    }

    /* Celebration Screen */
    .celebrate {
      display: none;
      flex-direction: column;
      align-items: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      z-index: 10;
    }

    .celebrate h2 {
      color: #ff1493;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .celebrate img {
      width: 260px;
      border-radius: 12px;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: fall linear forwards;
      z-index: 30;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>

<body>

  <!-- QUESTION CARD -->
  <div class="card" id="questionCard">
    <div class="avatar">🐣💗</div>
    <h1>BB will you be my valentine?</h1>

    <button class="yes" onclick="yesClicked()">Yes</button>
    <button class="no" id="noBtn">No</button>

    <div class="shy-text" id="shyText">
      Seems like No is feeling a little shy 😳
    </div>
  </div>

  <!-- CELEBRATION CARD -->
  <div class="celebrate" id="celebrateCard">
    <h2>YAY! 🎉 you're my Valentine</h2>
    <img src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="celebrate">
  </div>

<script>
  const noBtn = document.getElementById("noBtn");
  const shyText = document.getElementById("shyText");
  const questionCard = document.getElementById("questionCard");
  const celebrateCard = document.getElementById("celebrateCard");

  function moveNoButton() {
    shyText.style.display = "block";

    const padding = 100;
    const x = Math.random() * (window.innerWidth - padding);
    const y = Math.random() * (window.innerHeight - padding);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  // Escape attempts 😈
  noBtn.addEventListener("mouseover", moveNoButton);
  noBtn.addEventListener("mousedown", moveNoButton);
  noBtn.addEventListener("touchstart", moveNoButton);

  function yesClicked() {
    questionCard.style.display = "none";
    noBtn.style.display = "none";
    celebrateCard.style.display = "flex";
    launchConfetti();
  }

  function launchConfetti() {
    for (let i = 0; i < 160; i++) {
      const confetti = document.createElement("div");
      confetti.className = "confetti";
      document.body.appendChild(confetti);

      confetti.style.left = Math.random() * window.innerWidth + "px";
      confetti.style.backgroundColor =
        ["#ff69b4", "#ff1493", "#ffc0cb", "#ffd700"][Math.floor(Math.random() * 4)];
      confetti.style.animationDuration = Math.random() * 3 + 2 + "s";

      setTimeout(() => confetti.remove(), 5000);
    }
  }
</script>

</body>
</html>
